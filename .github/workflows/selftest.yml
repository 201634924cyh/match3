name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run selftest (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python selftest.py

      - name: Check the launcher scripts still parse
        if: runner.os == 'Windows'
        # 提示语必须保持纯 ASCII：Windows runner 的控制台是 cp1252，
        # 这条命令本身如果 print 中文就会 UnicodeEncodeError
        run: |
          python -c "t=open('run.bat','rb').read(); assert all(b<128 for b in t), 'run.bat has non-ASCII bytes'; assert t.count(b'\r\n')==t.count(b'\n'), 'run.bat has bare LF'; print('run.bat encoding/EOL ok')"
